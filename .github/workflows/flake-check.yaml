---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flake Check

on:
  pull_request:
    branches: ["main"]
    paths:
      - flake.nix
      - flake.lock
      - modules/**
      - .github/workflows/flake-check.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Flake Check - Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      # Fails if any file isn't nixfmt-formatted (rewrites in the runner only)
      - name: Check formatting
        run: nix fmt -- --ci

      # Tools come from this flake's locked nixpkgs, so versions move with flake.lock
      - name: Run statix
        if: ${{ !cancelled() }}
        run: nix run --inputs-from . nixpkgs#statix -- check .

      - name: Run deadnix
        if: ${{ !cancelled() }}
        # _hardware.nix is generated by nixos-generate-config; edits there get overwritten
        run: nix run --inputs-from . nixpkgs#deadnix -- --fail --exclude modules/hosts/pathfinder/_hardware.nix -- .

  check:
    name: Flake Check - Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      # Eval only: every host's toplevel is instantiated (options, assertions,
      # warnings) but nothing is built, so build-time failures aren't caught.
      # The result is reported after the comment is posted.
      - name: Run nix flake check
        id: check
        shell: bash
        run: |
          rc=0
          nix flake check --no-build --all-systems 2>&1 | tee check.log || rc=$?
          echo "rc=${rc}" >> "${GITHUB_OUTPUT}"

      - name: Build Comment
        id: comment
        env:
          CHECK_RC: ${{ steps.check.outputs.rc }}
        run: |
          # Each warning plus its continuation lines, up to the next nix log
          # line; deduped since every host repeats shared warnings.
          awk '
            function flush() { if (blk != "" && !seen[blk]++) print blk "\n"; blk = "" }
            /^(evaluation warning:|warning:|trace:)/ { flush(); blk = $0; next }
            /^(evaluating |checking |derivation evaluated to |copying path |all checks passed|error:)/ { flush(); next }
            blk != "" { blk = blk "\n" $0 }
            END { flush() }
          ' check.log > warnings.log

          if [[ "${CHECK_RC}" -eq 0 && ! -s warnings.log ]]; then
            echo "post=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "post=true" >> "${GITHUB_OUTPUT}"

          # GitHub caps comment bodies at 65536 characters
          limit=30000
          {
            if [[ "${CHECK_RC}" -ne 0 ]]; then
              echo '> [!CAUTION]'
              echo "> \`nix flake check --no-build\` failed."
              echo
              echo '```'
              sed -n '/^error:/,$p' check.log | head -c "${limit}"
              echo
              echo '```'
              echo
            fi
            if [[ -s warnings.log ]]; then
              echo '### Evaluation warnings'
              echo '```'
              head -c "${limit}" warnings.log
              echo '```'
            fi
          } > comment.md

      # Fork PRs get no secrets; they still get the check result, just no comment
      - name: Generate Token
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: "${{ secrets.BOT_CLIENT_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - if: ${{ steps.app-token.outputs.token && steps.comment.outputs.post == 'true' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/flake-check
          path: comment.md

      - if: ${{ steps.app-token.outputs.token && steps.comment.outputs.post != 'true' }}
        name: Remove Stale Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/flake-check
          delete: true

      - if: ${{ steps.check.outputs.rc != '0' }}
        name: Report Result
        run: |
          echo "::error::nix flake check --no-build failed; see the Run nix flake check step"
          exit 1
