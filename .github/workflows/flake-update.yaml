---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flake Update

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Flake Update - Update
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: "${{ secrets.BOT_CLIENT_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Update flake.lock
        shell: bash
        run: nix flake update 2>&1 | tee update.log

      - name: Build PR Body
        run: |
          {
            echo "Automated \`nix flake update\`."
            echo
            echo '```'
            grep -E "^•|^  →|^    " update.log || cat update.log
            echo '```'
          } > pr-body.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: "${{ steps.app-token.outputs.token }}"
          sign-commits: true
          branch: automation/flake-update
          delete-branch: true
          add-paths: flake.lock
          commit-message: "chore: update flake.lock"
          title: "chore: update flake.lock"
          body-path: pr-body.md
